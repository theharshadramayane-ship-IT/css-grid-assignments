<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 2: Blog Layout</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .nav { margin-bottom: 20px; }
        .nav a { margin-right: 15px; text-decoration: none; color: blue; font-weight: bold; }
        
        .blog-layout {
            display: grid;
            grid-template-areas: 
                "header header"
                "sidebar main"
                "footer footer";
            grid-template-columns: 1fr 3fr;
            grid-template-rows: 80px 300px 60px;
            gap: 15px;
        }
        .header { grid-area: header; background: #4ecdc4; color: white; display: flex; justify-content: center; align-items: center; font-size: 20px;}
        .sidebar { grid-area: sidebar; background: #ffe66d; display: flex; justify-content: center; align-items: center; font-size: 20px;}
        .main { grid-area: main; background: #1a535c; color: white; display: flex; justify-content: center; align-items: center; font-size: 20px;}
        .footer { grid-area: footer; background: #ff6b6b; color: white; display: flex; justify-content: center; align-items: center; font-size: 20px;}
    </style>
</head>
<body>
    <div class="nav">
        <a href="assignment1.html">Assignment 1</a>
        <a href="assignment2.html">Assignment 2</a>
        <a href="assignment3.html">Assignment 3</a>
        <a href="assignment4.html">Assignment 4</a>
        <a href="assignment5.html">Assignment 5</a>
        <a href="assignment6.html">Assignment 6</a>
    </div>
    <h2>Assignment 2: Blog Page Layout</h2>
    <p>Use named grid areas to create a layout with a header, sidebar, main content, and footer. Use fr units.</p>

    <div class="blog-layout">
        <div class="header">Header</div>
        <div class="sidebar">Sidebar</div>
        <div class="main">Main Content</div>
        <div class="footer">Footer</div>
    </div>
</body>
</html>
